<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RLOK - Log Files</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Dark Theme */
        html[data-theme="dark"] {
            --bg-color: #0a192f;
            --text-color: #e2e8f0;
            --navbar-bg: #0a192f;
            --navbar-border: #172a46;
            --card-bg: #0f2847;
            --table-row-bg: #0a192f;
            --table-row-hover: #172a46;
            --table-border: #172a46;
            --input-bg: #1e293b;
            --input-border: #334155;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .navbar {
            background-color: var(--navbar-bg) !important;
            border-bottom: 1px solid var(--navbar-border);
        }
        
        .card {
            background-color: var(--card-bg) !important;
            color: var(--text-color);
            border: none;
        }
        
        .table {
            color: var(--text-color);
        }
        
        .table thead th {
            border-bottom: 1px solid var(--table-border);
        }
        
        .table tbody tr {
            background-color: var(--table-row-bg);
            border-bottom: 1px solid var(--table-border);
        }
        
        .table tbody tr:hover {
            background-color: var(--table-row-hover);
        }
        
        .form-control {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-color);
        }
        
        .copy-btn {
            color: var(--text-color);
            background-color: transparent;
            border: none;
        }
        
        .copy-btn:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">RLOK</a>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search logs...">
                    </div>
                </div>
                <div class="col-md-3 ms-auto">
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary" onclick="loadLogs()">
                            <i class="fas fa-refresh me-1"></i> Load Logs
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover" id="logsTable">
                            <thead>
                                <tr>
                                    <th scope="col">File</th>
                                    <th scope="col">SHA256</th>
                                    <th scope="col">Size</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                                <tr>
                                    <td colspan="4" class="text-center">
                                        <i class="fas fa-spinner fa-spin"></i> Loading logs...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.8/dist/clipboard.min.js"></script>
    
    <script>
        // Mock data for demonstration
        const mockLogFiles = [
            {
                name: 'laravel.log',
                size: '712.24 KB',
                sha256: '4bb418fcd2a3b41843ef48ac597d6dd1234567890abcdef1234567890abcdef12'
            },
            {
                name: 'sdfdsf.txt.txt',
                size: '0 KB',
                sha256: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
            },
            {
                name: 'syslog-2025-04-02.log',
                size: '84.16 KB',
                sha256: '2637d9bab456234166291decbbbc10871234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-04.log',
                size: '0.04 KB',
                sha256: '802fa085688399344479816bea3c84bd71234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-05.log',
                size: '85.59 KB',
                sha256: '9ff75aafdf63eb50d7ae9ed133ffae481234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-06',
                size: '2.22 KB',
                sha256: '1b492260ffb635c54e809ca358f23d71234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-06.log',
                size: '0.47 KB',
                sha256: '0a9412d029aa8b23343c694a998f49f71234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-08.log',
                size: '172.82 KB',
                sha256: '763ad87e0685323c065293f680536ae01234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-09.log',
                size: '84.42 KB',
                sha256: '9de8bc733257c209f1a67619293a01ce1234567890abcdef1234567890abcdef'
            },
            {
                name: 'syslog-2025-04-10.log',
                size: '0.93 KB',
                sha256: '7e044667765d3d6ea89bb912d366d3c91234567890abcdef1234567890abcdef'
            }
        ];

        function loadLogs() {
            const tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = '';
            
            mockLogFiles.forEach(file => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="align-middle">
                        <i class="fas fa-file-alt me-2"></i> ${file.name}
                    </td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center">
                            ${file.sha256.substring(0, 32)}...
                            <button class="btn btn-sm ms-2 copy-btn" data-clipboard-text="${file.sha256}" title="Copy to clipboard">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </td>
                    <td class="align-middle">${file.size}</td>
                    <td class="align-middle">
                        <div class="d-flex gap-2">
                            <button class="btn btn-success" onclick="downloadFile('${file.name}')">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="btn btn-primary rounded-circle" onclick="previewFile('${file.name}')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            // Initialize clipboard.js
            new ClipboardJS('.copy-btn');
        }
        
        function downloadFile(filename) {
            alert('Download functionality would be implemented here for: ' + filename);
        }
        
        function previewFile(filename) {
            alert('Preview functionality would be implemented here for: ' + filename);
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const tableRows = document.querySelectorAll('#logsTable tbody tr');
            
            tableRows.forEach(row => {
                const fileName = row.querySelector('td:first-child').textContent.toLowerCase();
                if (fileName.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
        
        // Load logs on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadLogs();
        });
    </script>
</body>
</html>
