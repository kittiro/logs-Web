[build]
builder = "nixpacks"

[deploy]
startCommand = "mkdir -p storage/framework/{cache,sessions,views} && mkdir -p storage/logs && mkdir -p bootstrap/cache && chmod -R 775 storage bootstrap/cache && touch /tmp/database.sqlite && chmod 666 /tmp/database.sqlite && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10